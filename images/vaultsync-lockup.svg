<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="VaultSync — Smart POSM Inventory Solutions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a4a"/>
      <stop offset="100%" stop-color="#06102c"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B4ED8"/>
      <stop offset="55%" stop-color="#1236B0"/>
      <stop offset="100%" stop-color="#0A1F6A"/>
    </linearGradient>
    <linearGradient id="tileShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EA8FF" stop-opacity="0.32"/>
      <stop offset="48%" stop-color="#6EA8FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F6FF"/>
      <stop offset="50%" stop-color="#7EC8FF"/>
      <stop offset="100%" stop-color="#4AA6FF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7EC8FF" stop-opacity="0"/>
      <stop offset="15%" stop-color="#7EC8FF"/>
      <stop offset="100%" stop-color="#7EC8FF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hotGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <circle cx="640" cy="-40" r="360" fill="#1a4fe0" opacity="0.16"/>

